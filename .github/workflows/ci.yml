name: CI
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml-lint:
    name: yaml-lint
    runs-on: kei-docker-ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Lint YAML files and SKILL.md frontmatter
        run: |
          yamllint -c .yamllint.yml --no-warnings .
          node scripts/lint-frontmatter.mjs

  verify:
    name: verify-skills-repo
    runs-on: kei-docker-ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python deps
        run: pip install pyyaml
      - name: Lint skill frontmatter and required sections
        run: node scripts/verify-skills.mjs
      - name: Validate plugin manifests against their schema shape
        run: node scripts/verify-manifests.mjs
      - name: Validate portable skill eval fixtures
        run: node scripts/verify-evals.mjs
      - name: Fail on internal markdown links to missing files
        run: node scripts/check-internal-links.mjs
