profiles:
  deepseek-v4-flash:
    opencode_model: eval/deepseek-ai/DeepSeek-V4-Flash
    base_url_env: EVAL_DEEPSEEK_BASE_URL
    # Slot count (EV-C1 §3): the CI gate runs this many evals at once.
    concurrency: 4
    # Sandboxed harness runs can exceed 600 s on complex prompts.
    run_timeout_seconds: 1800
    # Greedy sampling with a fixed seed (EV-C1 §3), so a rerun of an unchanged
    # skill asks the model the same question the same way.
    temperature: 0
    seed: 42
    # No thinking on evals (owner decision 2026-10-12): the score measures the
    # answer, and reasoning tokens only make runs slower and longer.
    thinking: false
  qwen3.8-27b:
    opencode_model: eval/qwen3.8-27b
    base_url_env: EVAL_QWEN_BASE_URL
    # Slot count (EV-C1 §3): the CI gate runs this many evals at once. One
    # GPU serves Qwen to up to 4 CI runners and the workers' local runs, so
    # each CI job sends one request at a time (owner decision 2026-10-12).
    concurrency: 1
    # opencode runs on the shared 5090 can exceed the 600 s default.
    run_timeout_seconds: 1800
    temperature: 0
    seed: 42
    thinking: false
