profiles:
  glm-5.3-flash:
    opencode_model: eval/nvidia/GLM-5.3-Flash-FP4-Local
    # Historical name: EVAL_DEEPSEEK_BASE_URL now points at the GLM server
    # (DeepSeek V4 Flash was removed). Renaming the variable is a runner-env
    # change outside this repository.
    base_url_env: EVAL_DEEPSEEK_BASE_URL
    # Slot count (EV-C1 §3): the CI gate runs this many evals at once.
    concurrency: 2
    # Sandboxed harness runs can exceed 600 s on complex prompts.
    run_timeout_seconds: 1800
    # Runs (cases x repeats) per CI eval job: 8 hit the 30-minute pull request
    # job at the measured ~0.3 runs/min (a shard ran 30m17s, HAI-791), so 4,
    # about 15 minutes at that rate.
    shard_runs: 4
    # Greedy sampling with a fixed seed (EV-C1 §3), so a rerun of an unchanged
    # skill asks the model the same question the same way.
    temperature: 0
    seed: 42
    # Thinking on (EV-C1 §3, repo convention): the runner sends both
    # chat_template_kwargs spellings (enable_thinking and thinking), so the
    # GLM template's own switch is covered whichever it reads.
    thinking: true
  qwen3.8-27b:
    opencode_model: eval/qwen3.8-27b
    base_url_env: EVAL_QWEN_BASE_URL
    # Slot count (EV-C1 §3): the CI gate runs this many evals at once. One
    # GPU serves Qwen to up to 4 CI runners and the workers' local runs, so
    # each CI job sends one request at a time (owner decision 2026-10-12).
    concurrency: 1
    # opencode runs on the shared 5090 can exceed the 600 s default.
    run_timeout_seconds: 1800
    # Runs per CI eval job: 8 runs were cancelled at the 30-minute pull
    # request timeout when the shared GPU slowed the rate below ~0.3 runs/min
    # (HAI-791), so 4, about 15 minutes at the worst measured rate.
    shard_runs: 4
    # Qwen's recommended thinking-mode sampling (owner decision 2026-10-13):
    # with thinking on, greedy sampling makes it loop. The seed still fixes
    # the sample.
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    seed: 42
    thinking: true
